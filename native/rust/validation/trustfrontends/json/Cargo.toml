[package]
name = "cose_sign1_trustfrontends_json"
version = "0.1.0"
edition = { workspace = true }
license = { workspace = true }
description = "Canonical reference frontend (cose-tp-json/v1) for CoseSign1 trust policies."

[dependencies]
cose_sign1_trust_policy_spec = { path = "../../trust_policy_spec" }
cose_sign1_validation_primitives = { path = "../../primitives" }

# Translator runtime
serde = { workspace = true }
serde_json = { workspace = true }
jsonschema = { version = "0.30", default-features = false }
moka = { version = "0.12", features = ["sync"] }
blake3 = "1"

[dev-dependencies]
anyhow = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage,coverage_nightly)'] }
